<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Hanif Musabbir | Personal Website</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(145deg,#0b1220,#172b45);color:#f8fafc;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(100%,760px);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:28px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .cover{height:190px;background:radial-gradient(circle at 20% 20%,#38bdf8,transparent 35%),linear-gradient(120deg,#1d4ed8,#7c3aed 60%,#0f172a);position:relative}
    .cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(8,15,30,.35))}
    .content{padding:0 34px 36px;text-align:center}
    .avatar{width:116px;height:116px;border-radius:50%;margin:-58px auto 18px;position:relative;z-index:1;display:grid;place-items:center;background:linear-gradient(135deg,#38bdf8,#8b5cf6);border:5px solid #172238;font-size:34px;font-weight:800;letter-spacing:1px}
    h1{font-size:clamp(28px,6vw,42px);margin:8px 0 8px;letter-spacing:.5px}
    .tag{color:#93c5fd;font-weight:700;letter-spacing:3px;text-transform:uppercase;font-size:12px}
    .bio{color:#dbeafe;line-height:1.7;max-width:520px;margin:18px auto 26px}
    .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn{display:inline-block;text-decoration:none;padding:14px 22px;border-radius:999px;font-weight:700;transition:transform .2s,opacity .2s}
    .btn:hover{transform:translateY(-2px);opacity:.92}
    .primary{background:#1877f2;color:white}.secondary{border:1px solid rgba(255,255,255,.3);color:#f8fafc}
    .about{margin-top:34px;padding-top:25px;border-top:1px solid rgba(255,255,255,.14);text-align:left}
    .about h2{font-size:17px;margin:0 0 10px}.about p{color:#cbd5e1;line-height:1.7;margin:0}
    footer{margin-top:28px;color:#94a3b8;font-size:12px}
    @media(max-width:520px){.content{padding:0 22px 28px}.cover{height:150px}.avatar{width:104px;height:104px;margin-top:-52px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="cover"></div>
    <section class="content">
      <div class="avatar" aria-label="Hanif Musabbir initials">HM</div>
      <div class="tag">Personal Website</div>
      <h1>Hanif Musabbir</h1>
      <p class="bio">Welcome to my personal space. Follow my Facebook profile to see my latest updates, photos and moments.</p>
      <div class="links">
        <a class="btn primary" href="https://www.facebook.com/share/1En7ZPvLZL/" target="_blank" rel="noopener noreferrer">Visit My Facebook</a>
        <a class="btn secondary" href="https://www.facebook.com/share/1En7ZPvLZL/" target="_blank" rel="noopener noreferrer">Connect With Me</a>
      </div>
      <div class="about">
        <h2>About Me</h2>
        <p>This is my personal website. Thanks for visiting!</p>
      </div>
      <footer>© 2026 Hanif Musabbir · Personal Website</footer>
    </section>
  </main>
</body>
</html>
